{% extends "base.html" %}
{% block title %}Neues Passwort{% endblock %}
{% block content %}

<style>
    .konto-karte {
        background: white;
        max-width: 460px;
        margin: 60px auto;
        padding: 44px 40px;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .konto-karte h1 { margin: 0 0 8px; font-size: 1.7rem; }
    .konto-karte .unter { color: #718096; font-size: 0.92rem; margin: 0 0 28px; }
    .feld { margin-bottom: 18px; }
    .feld label {
        display: block; margin-bottom: 7px;
        font-size: 0.82rem; font-weight: 600; color: #4A5568;
    }
    .feld input {
        width: 100%; box-sizing: border-box;
        padding: 13px 16px;
        border: 2px solid #EDF0F7; border-radius: 14px;
        font-family: inherit; font-size: 1rem;
        background: #FBFBFF; transition: border-color 0.2s;
    }
    .feld input:focus { outline: none; border-color: #7F73CF; background: white; }
    .knopf-voll {
        width: 100%; border: none; cursor: pointer;
        background: linear-gradient(135deg, #7F73CF 0%, #B885DC 100%);
        color: white; padding: 15px;
        border-radius: 100px; font-size: 1rem; font-weight: 600;
        font-family: inherit; margin-top: 8px;
        transition: transform 0.2s;
    }
    .knopf-voll:hover { transform: scale(1.02); }
    .konto-fuss { text-align: center; margin-top: 22px; font-size: 0.88rem; color: #718096; }
    .konto-fuss a { color: #7F73CF; font-weight: 600; text-decoration: none; }
    .link-kasten {
        background: #FFFAF0; border: 1px solid #FBD38D;
        border-radius: 14px; padding: 16px; margin-bottom: 22px;
        font-size: 0.85rem; word-break: break-all;
    }
    .link-kasten strong { display: block; margin-bottom: 8px; color: #975A16; }
</style>

<div class="konto-karte">
    <h1>Neues Passwort</h1>
    <p class="unter">Wähle ein neues Passwort. Mindestens 6 Zeichen.</p>

    <form method="POST">
        <div class="feld">
            <label>Neues Passwort</label>
            <input type="password" name="password" required autofocus placeholder="••••••••">
        </div>
        <div class="feld">
            <label>Nochmals eingeben</label>
            <input type="password" name="password2" required placeholder="••••••••">
        </div>
        <button type="submit" class="knopf-voll">Passwort speichern</button>
    </form>

    <div class="konto-fuss">
        <a href="{{ url_for('login') }}">← Zurück zum Login</a>
    </div>
</div>

{% endblock %}
