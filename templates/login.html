{% extends "base.html" %}
{% block title %}Einloggen{% endblock %}
{% block content %}

<style>
    .konto-karte {
        background: white;
        max-width: 460px;
        margin: 60px auto;
        padding: 44px 40px;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .konto-karte h1 { margin: 0 0 8px; font-size: 1.7rem; }
    .konto-karte .unter { color: #718096; font-size: 0.92rem; margin: 0 0 28px; }
    .konto-karte .unter a { color: #7F73CF; font-weight: 600; text-decoration: none; }
    .feld { margin-bottom: 18px; }
    .feld label {
        display: block; margin-bottom: 7px;
        font-size: 0.82rem; font-weight: 600; color: #4A5568;
    }
    .feld input {
        width: 100%; box-sizing: border-box;
        padding: 13px 16px;
        border: 2px solid #EDF0F7; border-radius: 14px;
        font-family: inherit; font-size: 1rem;
        background: #FBFBFF; transition: border-color 0.2s;
    }
    .feld input:focus { outline: none; border-color: #7F73CF; background: white; }
    .merken {
        display: flex; align-items: center; gap: 9px;
        font-size: 0.88rem; color: #718096; margin-bottom: 22px;
    }
    .merken input { width: 16px; height: 16px; accent-color: #7F73CF; }
    .knopf-voll {
        width: 100%; border: none; cursor: pointer;
        background: linear-gradient(135deg, #7F73CF 0%, #B885DC 100%);
        color: white; padding: 15px;
        border-radius: 100px; font-size: 1rem; font-weight: 600;
        font-family: inherit;
        transition: transform 0.2s;
    }
    .knopf-voll:hover { transform: scale(1.02); }
    .konto-fuss { text-align: center; margin-top: 22px; font-size: 0.85rem; }
    .konto-fuss a { color: #A3A3A3; text-decoration: none; }
</style>

<div class="konto-karte">
    <h1>Willkommen zurück</h1>
    <p class="unter">Noch kein Konto?
        <a href="{{ url_for('register') }}">Jetzt registrieren</a></p>

    <form method="POST">
        <div class="feld">
            <label>E-Mail</label>
            <input type="email" name="email" required autofocus placeholder="du@beispiel.ch">
        </div>
        <div class="feld">
            <label>Passwort</label>
            <input type="password" name="password" required placeholder="••••••••">
        </div>
        <div class="merken">
            <input type="checkbox" name="remember" id="remember">
            <label for="remember" style="margin:0; font-weight:400; color:#718096;">Angemeldet bleiben</label>
        </div>
        <button type="submit" class="knopf-voll">Einloggen</button>
    </form>

    <div class="konto-fuss">
        <a href="{{ url_for('passwort_vergessen') }}">Passwort vergessen?</a>
    </div>
</div>

{% endblock %}
